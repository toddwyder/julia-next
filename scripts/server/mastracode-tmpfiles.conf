# Installed as /etc/tmpfiles.d/mastracode.conf (0644 root:root).
#
# Mastra Code keeps its cross-process signal sockets under /tmp/mc, one of them
# the lease socket that says which process owns a thread, and it keeps the
# socket of a run that is still going (@mastra/code-sdk/dist/utils/signals-
# pubsub.js:5). The stock /tmp rule in /usr/lib/tmpfiles.d/tmp.conf removes
# anything there older than 30 days, and the pass at boot clears the directory.
# A session that loses its lease socket mid-run is aborted with
# thread-lease-lost, which the memory step reports as "Processor
# \"observational-memory\" stopped the run: Agent execution was aborted".
#
# The x line excludes /tmp/mc from every later cleanup rule, boot pass
# included, and /etc sorts before /usr/lib. Never delete /tmp/mc by hand either.
x /tmp/mc - - - -
