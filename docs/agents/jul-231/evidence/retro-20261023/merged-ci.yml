name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install pinned Bun runtime
        run: npm install --global bun@1.4.4
      - name: Discover test ownership
        run: node scripts/test-owners.mjs --plan
      - name: Install each owner's locked dependencies
        run: node scripts/test-owners.mjs --install
      - name: Install browser runtimes declared by local test owners
        run: node scripts/test-owners.mjs --install-browsers local
      - name: Run every local package test
        run: node scripts/test-owners.mjs --run local
      - name: Builder client must never read the Axiom credential
        run: |
          set -euo pipefail
          if grep -rE 'process\.env\.AXIOM_(TOKEN|DATASET)' scripts/; then
            echo "::error::builder-side script under scripts/ reads an Axiom credential env var directly"
            exit 1
          fi

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install application dependencies
        run: npm ci
      - name: Install browser owners' locked dependencies
        run: node scripts/test-owners.mjs --install browser
      - name: Install each browser owner's Chromium
        run: node scripts/test-owners.mjs --install-browsers browser
      - name: Run skill-owned browser tests
        run: node scripts/test-owners.mjs --run browser
      - name: Lint framework code
        run: npm run lint:framework
      - name: Build application
        run: npm run build

  server-tests:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Await exact candidate's server-owned tests
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/await-server-tests.mjs "$CANDIDATE_HEAD"

  checks:
    needs: [package-tests, web, server-tests]
    if: always()
    runs-on: ubuntu-22.04
    env:
      PACKAGE_TESTS: ${{ needs.package-tests.result }}
      WEB: ${{ needs.web.result }}
      SERVER_TESTS: ${{ needs.server-tests.result }}
    steps:
      - name: Require every test environment to pass
        run: |
          set -euo pipefail
          [[ "$PACKAGE_TESTS" == success ]]
          [[ "$WEB" == success ]]
          [[ "$SERVER_TESTS" == success ]]
