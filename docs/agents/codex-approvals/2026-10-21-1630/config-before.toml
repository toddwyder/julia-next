# Julia delivery defaults, approved by Todd 2026-10-20.
default_permissions = "julia-delivery"
approval_policy = "on-request"
check_for_update_on_startup = false

[permissions.julia-delivery]
description = "Julia server delivery: workspace writes, control root and outbound network"
extends = ":workspace"

[permissions.julia-delivery.workspace_roots]
"/opt/julia-control" = true

[permissions.julia-delivery.network]
enabled = true

[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "thread-name", "model", "context-used", "five-hour-limit", "weekly-limit", "task-progress"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[projects."/home/ubuntu/julia-next"]
trust_level = "trusted"

[apps.connector_76869538009648d5b282a4bb21c3d157.tools."github.create_tree"]
approval_mode = "approve"

[apps.connector_76869538009648d5b282a4bb21c3d157.tools."github.create_commit"]
approval_mode = "approve"

[apps.connector_76869538009648d5b282a4bb21c3d157.tools."github.create_branch"]
approval_mode = "approve"
