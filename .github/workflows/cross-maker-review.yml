name: Cross-maker review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cross-maker-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@v3
        id: reviewer_app
        if: ${{ vars.JULIA_REVIEWER_APP_ID != '' }}
        with:
          app-id: ${{ vars.JULIA_REVIEWER_APP_ID }}
          private-key: ${{ secrets.JULIA_REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: julia-next
          permission-pull-requests: write
          permission-issues: write
      - name: Ask the Mastra reviewer and submit its GitHub review
        env:
          GITHUB_TOKEN: ${{ steps.reviewer_app.outputs.token || github.token }}
          JULIA_REVIEW_ROUTE_SECRET: ${{ secrets.JULIA_REVIEW_ROUTE_SECRET }}
        run: node .github/scripts/request-cross-maker-review.mjs
