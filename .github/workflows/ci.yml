name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      baseline: ${{ steps.routes.outputs.baseline }}
      julia_init_windows: ${{ steps.routes.outputs.julia_init_windows }}
      factory: ${{ steps.routes.outputs.factory }}
      database: ${{ steps.routes.outputs.database }}
      web: ${{ steps.routes.outputs.web }}
      docs_policy: ${{ steps.routes.outputs.docs_policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Select CI gates from changed paths
        id: routes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            routes="$(node scripts/ci-routing.mjs --github-output "$BASE_SHA" "$HEAD_SHA")"
            echo "Changed paths:"
            git diff --name-status --no-renames "$BASE_SHA" "$HEAD_SHA"
            echo "Selected gates:"
            printf '%s\n' "$routes"
            printf '%s\n' "$routes" >> "$GITHUB_OUTPUT"
          else
            echo "Changed paths unavailable; selecting every gate."
            echo "Selected gates: all"
            printf '%s\n' baseline=true julia_init_windows=true factory=true database=true web=true docs_policy=true >> "$GITHUB_OUTPUT"
          fi

  baseline:
    needs: changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Test CI gate routing
        run: node --test scripts/ci-routing.test.mjs
      - name: Check repository line endings
        run: node --test scripts/line-endings.test.mjs
      - name: Syntax-check changed scripts and operations modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            node scripts/ci-routing.mjs --syntax-check "$BASE_SHA" "$HEAD_SHA"
          else
            find scripts ops -name '*.mjs' -print0 | xargs -0 -n1 node --check
          fi
      - name: Builder client must never read the Axiom credential
        run: |
          set -euo pipefail
          if grep -rE 'process\.env\.AXIOM_(TOKEN|DATASET)' scripts/; then
            echo "::error::builder-side script under scripts/ reads an Axiom credential env var directly"
            exit 1
          fi
          echo "OK: no Axiom credential read under scripts/"

  julia-init-windows:
    needs: changes
    if: needs.changes.outputs.julia_init_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Test literal-dollar model selection without workers
        run: node --test scripts/delivery-tool-settings.test.mjs scripts/julia-init.test.mjs

  factory:
    needs: changes
    if: needs.changes.outputs.factory == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Run Factory workflows, skills, and retention tests
        run: node --test ops/factory/workflows.test.mjs ops/factory/skills.test.mjs ops/factory/trace-retention.test.mjs
      - name: Run Factory sandbox isolation tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          npm ci --prefix ops/factory/app
          node --experimental-strip-types --test ops/factory/app/local-sandbox.test.mjs
          (cd ops/factory/app && node --experimental-strip-types --import ./register-typescript-esm.mjs \
            --test observability-retention.test.mjs observability-retention-schedule.test.mjs \
            review-route-batching.test.mjs)
          npm run check --prefix ops/factory/app
      - name: Run Factory installation tests
        run: node --test ops/factory/install.test.mjs

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Run face-value PostgreSQL integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python3 ops/factory/model-face-values.sql.test.py "$DATABASE_URL"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install application dependencies
        run: npm ci
      - name: Run current application tests
        run: node --test scripts/health-route.test.mjs scripts/dynamic-route.test.mjs scripts/web-app.test.mjs scripts/framework-lint.test.mjs
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Lint framework code
        run: npm run lint:framework
      - name: Build application
        run: npm run build

  docs-policy:
    needs: changes
    if: needs.changes.outputs.docs_policy == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Run documentation and policy tests
        run: |
          node --test scripts/agent-docs.test.mjs \
            scripts/no-personal-paths.test.mjs scripts/personal-paths.test.mjs scripts/merge-pr.test.mjs \
            scripts/publish-pr.test.mjs scripts/publish-pr.real-git.test.mjs \
            scripts/publish-via-github-app.test.mjs

  checks:
    needs: [changes, baseline, julia-init-windows, factory, database, web, docs-policy]
    if: always()
    runs-on: ubuntu-22.04
    env:
      GATE_CHANGES: ${{ needs.changes.result }}
      GATE_BASELINE: ${{ needs.baseline.result }}
      GATE_JULIA_INIT_WINDOWS: ${{ needs.julia-init-windows.result }}
      GATE_FACTORY: ${{ needs.factory.result }}
      GATE_DATABASE: ${{ needs.database.result }}
      GATE_WEB: ${{ needs.web.result }}
      GATE_DOCS_POLICY: ${{ needs.docs-policy.result }}
    steps:
      - name: Verify selected gates completed
        run: |
          set -euo pipefail
          gates=(changes baseline julia-init-windows factory database web docs-policy)
          results=("$GATE_CHANGES" "$GATE_BASELINE" "$GATE_JULIA_INIT_WINDOWS" "$GATE_FACTORY" "$GATE_DATABASE" "$GATE_WEB" "$GATE_DOCS_POLICY")
          status=0
          for index in "${!gates[@]}"; do
            gate="${gates[$index]}"
            result="${results[$index]}"
            case "$result" in
              success) echo "$gate completed successfully" ;;
              skipped) echo "$gate not applicable (skipped)" ;;
              *) echo "::error::$gate ended with $result"; status=1 ;;
            esac
          done
          exit "$status"
