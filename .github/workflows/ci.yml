name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # ubuntu-latest rejects the bubblewrap command on the hosted runner.
    # Run the actual sandbox behavior tests on GitHub's Ubuntu 22.04 VM.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect documentation-only PR
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] &&
             git cat-file -e "$BASE_SHA^{commit}" && git cat-file -e "$HEAD_SHA^{commit}"; then
            docs_only=true
            while IFS= read -r -d '' path; do
              if [[ ! "$path" =~ ^docs/.+\.md$ ]]; then docs_only=false; break; fi
            done < <(git diff --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA")
            if ! git diff --quiet --diff-filter=D "$BASE_SHA" "$HEAD_SHA" -- ||
               git diff --quiet "$BASE_SHA" "$HEAD_SHA" --; then
              docs_only=false
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation-only PR: $docs_only"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Syntax-check all scripts
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "checking $f"
            node --check "$f" || status=1
          done < <(find scripts ops -name '*.mjs' -print0)
          exit $status

      - name: Builder client must never read the Axiom credential
        run: |
          set -euo pipefail
          # scripts/ is builder-side code (runs under the low-privilege builder
          # account). ops/journey-relay/ is the trusted boundary and is the one
          # place allowed to read AXIOM_TOKEN/AXIOM_DATASET. Comments in
          # scripts/ are allowed to *mention* those names (they document the
          # boundary); only an actual process.env read is disallowed.
          if grep -rE 'process\.env\.AXIOM_(TOKEN|DATASET)' scripts/; then
            echo "::error::builder-side script under scripts/ reads an Axiom credential env var directly"
            exit 1
          fi
          echo "OK: no Axiom credential read under scripts/"

      - name: Relay must bind to localhost only
        run: |
          set -euo pipefail
          if ! grep -qE "listen\([^)]*'127\.0\.0\.1'" ops/journey-relay/relay.mjs; then
            echo "::error::relay.mjs must bind explicitly to 127.0.0.1, not 0.0.0.0/all interfaces"
            exit 1
          fi
          echo "OK: relay binds to 127.0.0.1"

      - name: Relay systemd unit must run as the dedicated low-privilege account
        run: |
          set -euo pipefail
          unit=ops/journey-relay/journey-relay.service
          for directive in 'User=axiom-relay' 'NoNewPrivileges=' 'ProtectSystem=' 'ProtectHome=' 'EnvironmentFile='; do
            if ! grep -q "$directive" "$unit"; then
              echo "::error::$unit is missing expected hardening directive: $directive"
              exit 1
            fi
          done
          echo "OK: journey-relay.service has expected account and hardening directives"

      - name: Example env file must not contain a real-looking token
        run: |
          set -euo pipefail
          example=ops/journey-relay/journey-axiom.env.example
          value=$(grep -E '^AXIOM_TOKEN=' "$example" | cut -d= -f2-)
          if [[ "$value" != *REPLACE* && "$value" != *PLACEHOLDER* && "$value" != "" ]]; then
            echo "::error::$example's AXIOM_TOKEN does not look like a placeholder (expected it to contain REPLACE or PLACEHOLDER)"
            exit 1
          fi
          echo "OK: example env file holds only placeholder values"

      - name: Run documentation and policy tests
        run: |
          node --test scripts/agent-docs.test.mjs scripts/line-endings.test.mjs \
            scripts/no-personal-paths.test.mjs scripts/merge-pr.test.mjs \
            scripts/publish-pr.test.mjs scripts/publish-pr.real-git.test.mjs \
            scripts/publish-via-github-app.test.mjs ops/factory/workflows.test.mjs \
            ops/factory/skills.test.mjs

      - name: Install application dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Run Factory sandbox isolation tests
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          npm ci --prefix ops/factory/app
          node --experimental-strip-types --test ops/factory/app/local-sandbox.test.mjs
          npm run check --prefix ops/factory/app

      - name: Run current application and installation tests
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          node --test scripts/health-route.test.mjs scripts/dynamic-route.test.mjs \
            scripts/web-app.test.mjs scripts/framework-lint.test.mjs \
            scripts/personal-paths.test.mjs ops/factory/install.test.mjs

      - name: Install Chromium
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install chromium
      - name: Run browser tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright test
      - name: Lint framework code
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint:framework
      - name: Build application
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
