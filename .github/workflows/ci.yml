name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find out whether only documents changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "$EVENT" == pull_request ]]; then
            files=$(git diff --name-only "$BASE" "$HEAD")
            if [[ -n "$files" ]] && ! grep -qv '\.md$' <<< "$files"; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  repository-hygiene:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Check skill names are unique
        run: node scripts/check-skill-names.mjs
      - name: Check agent-read files point at paths that exist
        run: node scripts/check-agent-links.mjs
      - name: Check the machine program list is up to date
        run: node scripts/machine-programs.mjs --check
      - name: Check every branch has an open pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-branch-pr.mjs

  package-tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/bun.lockb') }}
      - name: Plan the test owners
        run: node scripts/test-owners.mjs --plan
      - name: Install locked dependencies
        run: node scripts/test-owners.mjs --install
      - name: Install each local owner's locked dependencies
        run: node scripts/test-owners.mjs --install local
      - name: Run local owners' tests
        run: node scripts/test-owners.mjs --run local
      - name: Install each browser owner's locked dependencies
        run: node scripts/test-owners.mjs --install browser
      - name: Install each browser owner's Chromium
        run: node scripts/test-owners.mjs --install-browsers browser
      - name: Run skill-owned browser tests
        run: node scripts/test-owners.mjs --run browser

  web:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install the application's locked dependencies
        run: npm ci
      - name: Install each browser owner's locked dependencies
        run: node scripts/test-owners.mjs --install browser
      - name: Install each browser owner's Chromium
        run: node scripts/test-owners.mjs --install-browsers browser
      - name: Guard the workflow folder
        run: npm run guard:flow
      - name: Guard the Julia and machine boundary
        run: npm run guard:boundaries
      - name: Build application
        run: npm run build

  checks:
    needs: [changes, repository-hygiene, package-tests, web]
    if: always()
    runs-on: ubuntu-22.04
    env:
      CHANGES: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
      PACKAGE_TESTS: ${{ needs.package-tests.result }}
      WEB: ${{ needs.web.result }}
    steps:
      - name: Require every job to pass
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          [[ "$REPOSITORY_HYGIENE" == success ]]
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$PACKAGE_TESTS" == skipped ]]
            [[ "$WEB" == skipped ]]
          else
            [[ "$PACKAGE_TESTS" == success ]]
            [[ "$WEB" == success ]]
          fi
