name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    # JUL-183: hosted Actions is billing-blocked. Keep trial jobs on its
    # dedicated OVH account, and accept only same-repository publisher PRs.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["julia-graph-publisher[bot]", "julia-factory-todd-wyder[bot]"]'), github.event.pull_request.user.login))
    runs-on: [self-hosted, Linux, X64, julia-factory-trial]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Syntax-check all scripts
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "checking $f"
            node --check "$f" || status=1
          done < <(find scripts ops -name '*.mjs' -print0)
          exit $status

      - name: Builder client must never read the Axiom credential
        run: |
          set -euo pipefail
          # scripts/ is builder-side code (runs under the low-privilege builder
          # account). ops/journey-relay/ is the trusted boundary and is the one
          # place allowed to read AXIOM_TOKEN/AXIOM_DATASET. Comments in
          # scripts/ are allowed to *mention* those names (they document the
          # boundary); only an actual process.env read is disallowed.
          if grep -rE 'process\.env\.AXIOM_(TOKEN|DATASET)' scripts/; then
            echo "::error::builder-side script under scripts/ reads an Axiom credential env var directly"
            exit 1
          fi
          echo "OK: no Axiom credential read under scripts/"

      - name: Relay must bind to localhost only
        run: |
          set -euo pipefail
          if ! grep -qE "listen\([^)]*'127\.0\.0\.1'" ops/journey-relay/relay.mjs; then
            echo "::error::relay.mjs must bind explicitly to 127.0.0.1, not 0.0.0.0/all interfaces"
            exit 1
          fi
          echo "OK: relay binds to 127.0.0.1"

      - name: Relay systemd unit must run as the dedicated low-privilege account
        run: |
          set -euo pipefail
          unit=ops/journey-relay/journey-relay.service
          for directive in 'User=axiom-relay' 'NoNewPrivileges=' 'ProtectSystem=' 'ProtectHome=' 'EnvironmentFile='; do
            if ! grep -q "$directive" "$unit"; then
              echo "::error::$unit is missing expected hardening directive: $directive"
              exit 1
            fi
          done
          echo "OK: journey-relay.service has expected account and hardening directives"

      - name: Example env file must not contain a real-looking token
        run: |
          set -euo pipefail
          example=ops/journey-relay/journey-axiom.env.example
          value=$(grep -E '^AXIOM_TOKEN=' "$example" | cut -d= -f2-)
          if [[ "$value" != *REPLACE* && "$value" != *PLACEHOLDER* && "$value" != "" ]]; then
            echo "::error::$example's AXIOM_TOKEN does not look like a placeholder (expected it to contain REPLACE or PLACEHOLDER)"
            exit 1
          fi
          echo "OK: example env file holds only placeholder values"

      - name: Run scripts/ unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          tests=(scripts/*.test.mjs)
          # The frozen graph's execution suite is required when its inputs
          # change. Application-only changes retain all other script checks.
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git diff --quiet "$BASE_SHA" HEAD -- graph/pydantic scripts/independent-review.test.mjs; then
            selected=()
            for test in "${tests[@]}"; do
              [ "$test" = scripts/independent-review.test.mjs ] || selected+=("$test")
            done
            tests=("${selected[@]}")
            echo 'Frozen graph execution unchanged; running the application and other script checks.'
          fi
          node --test "${tests[@]}"

      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test
      - run: npm run lint:framework
      - run: npm run build
