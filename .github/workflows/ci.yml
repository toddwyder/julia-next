name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Check skill names are unique
        run: node scripts/check-skill-names.mjs
      - name: Check agent-read files point at paths that exist
        run: node scripts/check-agent-links.mjs
      - name: Check the machine program list is up to date
        run: node scripts/machine-programs.mjs --check
      - name: Check the enforced pstack anchors are intact
        run: node scripts/check-pstack-anchors.mjs
      - name: Check every branch has an open pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-branch-pr.mjs

  pstack-text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: List the pstack text this pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pstack-anchors.mjs --new-text --base "$BASE" > "$RUNNER_TEMP/pstack-text.md"
      - name: Post the list as a pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/pstack-text.md" ]] || exit 0
          found=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pstack-anchors -->")) | .id')
          if [[ -n "$found" ]]; then
            url="repos/$GITHUB_REPOSITORY/issues/comments/${found%%$'\n'*}"
            method=PATCH
          else
            url="repos/$GITHUB_REPOSITORY/issues/$PR/comments"
            method=POST
          fi
          gh api --method "$method" "$url" --input <(jq -n --rawfile body "$RUNNER_TEMP/pstack-text.md" '{body: $body}')

  package-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Plan the test owners
        run: node scripts/test-owners.mjs --plan
      - name: Install locked dependencies
        run: node scripts/test-owners.mjs --install
      - name: Install each local owner's locked dependencies
        run: node scripts/test-owners.mjs --install local
      - name: Run local owners' tests
        run: node scripts/test-owners.mjs --run local
      - name: Install each browser owner's locked dependencies
        run: node scripts/test-owners.mjs --install browser
      - name: Install each browser owner's Chromium
        run: node scripts/test-owners.mjs --install-browsers browser
      - name: Run skill-owned browser tests
        run: node scripts/test-owners.mjs --run browser

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install the application's locked dependencies
        run: npm ci
      - name: Install each browser owner's locked dependencies
        run: node scripts/test-owners.mjs --install browser
      - name: Install each browser owner's Chromium
        run: node scripts/test-owners.mjs --install-browsers browser
      - name: Guard the workflow folder
        run: npm run guard:flow
      - name: Build application
        run: npm run build

  checks:
    needs: [repository-hygiene, package-tests, web, pstack-text]
    if: always()
    runs-on: ubuntu-22.04
    env:
      REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
      PACKAGE_TESTS: ${{ needs.package-tests.result }}
      WEB: ${{ needs.web.result }}
      PSTACK_TEXT: ${{ needs.pstack-text.result }}
    steps:
      - name: Require every job to pass
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_HYGIENE" == success ]]
          [[ "$PACKAGE_TESTS" == success ]]
          [[ "$WEB" == success ]]
          [[ "$PSTACK_TEXT" == success || "$PSTACK_TEXT" == skipped ]]
