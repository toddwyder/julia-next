name: mutation-audit

# Mutation testing of the machine's tests, run by hand. It finds tests that catch nothing.
# It never gates a pull request: the report is read, and weak tests are fixed or removed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machine-mutation-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the application's locked dependencies
        run: npm ci
      - name: Mutate the whole machine
        run: npm run test:mutation
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
